# Checks for every pull request.
#
# The command of each job matches a row of the table in CLAUDE.md and the procedure in
# skills/c-compliance-check. A job fails on a finding in a native file only. Adopted code
# stays outside every check (docs/adr/2026-10-01-misra-c-2012-coding-baseline.md).
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job reads the repository and writes nothing back.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # The paths that Bolis authors. The coding baseline applies to these and to no other path.
  BOL_NATIVE_PATHS: >-
    components/bolis/src
    components/bolis/include
    components/bolis/priv_include
    components/bolis/test
    components/bolis/test_apps
    components/bolis/examples/bench/main

  # The cppcheck version behind the compliance evidence. The MISRA job builds this
  # version from source and fails when the build produces another one
  # (docs/adr/2026-11-09-cppcheck-version-pin.md). docs/compliance/misra-gcs.md names
  # the same version. A change here changes that file in the same pull request.
  BOL_CPPCHECK_VERSION: "2.19.1"

jobs:
  build:
    name: Build on ESP-IDF ${{ matrix.idf }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Decision record 2026-10-01-esp-idf-v5-5-minimum.md sets v5.5 as the minimum, and
        # the component builds on v5.5 and on each later minor release that Espressif
        # supports. v5.5 is the newest minor release at this date, so the matrix holds one
        # entry. Add the next minor release here when Espressif publishes it.
        idf: [release-v5.5]
    container: espressif/idf:${{ matrix.idf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the bench example and the test app
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          idf.py -C components/bolis/examples/bench build 2>&1 | tee build-bench.log
          idf.py -C components/bolis/test_apps/json build 2>&1 | tee build-test.log

      - name: Treat a warning in a native file as an error
        shell: bash
        run: |
          set -euo pipefail
          # The component carries no -Werror, because a newer compiler in the build of a
          # user can add a warning. CI applies that rule to its own build instead.
          if grep -nE 'components/bolis/.*(warning|error):' build-bench.log build-test.log; then
            echo "A native file produced a compiler diagnostic."
            exit 1
          fi
          echo "No compiler diagnostic in a native file."

  format:
    name: Layout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install astyle_py
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          # astyle_py is not part of the core requirements of ESP-IDF, so the image does not
          # carry it. The version matches the one that docs/compliance/misra-gcs.md records,
          # so the layout of a file does not depend on where the check runs.
          python -m pip install --disable-pip-version-check "astyle_py==1.1.0"
          astyle_py --version

      - name: Format every native file and report a change
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          read -ra paths <<< "${BOL_NATIVE_PATHS}"
          # A build directory holds generated C, which is not a file that Bolis authors.
          mapfile -t sources < <(find "${paths[@]}" \
            -path '*/build/*' -prune -o \
            \( -name '*.c' -o -name '*.h' \) -print)
          printf 'checking %d files\n' "${#sources[@]}"
          printf '  %s\n' "${sources[@]}"
          astyle_py --rules="${IDF_PATH}/tools/ci/astyle-rules.yml" "${sources[@]}"
          if ! git diff --exit-code; then
            echo "astyle_py changed a native file. Commit the formatted file."
            exit 1
          fi

  tests:
    name: Reader tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the host library that the linux target needs
        shell: bash
        run: |
          set -euo pipefail
          # The linux component of ESP-IDF wraps the libbsd headers.
          apt-get update
          apt-get install --yes --no-install-recommends libbsd-dev

      - name: Build the test app for the linux target
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          # The reader needs no radio, so the cases run on the host and need no node.
          idf.py -C components/bolis/test_apps/json --preview set-target linux
          idf.py -C components/bolis/test_apps/json build

      - name: Run the test cases and read the result from the output
        shell: bash
        run: |
          set -euo pipefail
          # The process does not end once the cases finish, because app_main returning
          # leaves the scheduler running. The run therefore carries a time limit, and its
          # exit code reports nothing. unity_run_all_tests also prints no summary line.
          # This step reads the result from the output instead.
          timeout 300 ./components/bolis/test_apps/json/build/bolis_json_test.elf \
            > tests.log 2>&1 || true
          cat tests.log

          if grep -q ':FAIL' tests.log; then
            echo "A test case failed."
            exit 1
          fi

          # A crash partway through leaves a log of passes and no failure, so the count of
          # passes must match the count of cases in the source.
          expected="$(cat components/bolis/test/test_bol_*.c | grep -c '^TEST_CASE(')"
          passed="$(grep -c ':PASS' tests.log || true)"
          if [ "${passed}" -ne "${expected}" ]; then
            printf '%s of %s cases ran. The run stopped early.\n' "${passed}" "${expected}"
            exit 1
          fi
          printf '%s test cases passed.\n' "${passed}"

  misra:
    name: MISRA C:2012
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build cppcheck from source
        shell: bash
        run: |
          set -euo pipefail
          # The apt of this image carried cppcheck 2.13.0, which reports none of the
          # Rule 10.4 findings that the compliance evidence records, so CI checked less
          # than docs/compliance/misra-gcs.md claimed. The job builds the pinned version
          # instead (docs/adr/2026-11-09-cppcheck-version-pin.md).
          apt-get update
          apt-get install --yes --no-install-recommends cmake curl g++ make
          curl -fsSL -o cppcheck.tar.gz \
            "https://github.com/danmar/cppcheck/archive/refs/tags/${BOL_CPPCHECK_VERSION}.tar.gz"
          mkdir -p cppcheck-src
          tar -xzf cppcheck.tar.gz -C cppcheck-src --strip-components=1
          # The match compiler and the rule back end both lengthen the build. The MISRA
          # addon needs neither: it reads a dump that cppcheck writes, through python3.
          cmake -S cppcheck-src -B cppcheck-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_MATCHCOMPILER=OFF \
            -DHAVE_RULES=OFF
          cmake --build cppcheck-build --parallel "$(nproc)"
          cmake --install cppcheck-build

      - name: Assert the cppcheck version matches the pin
        shell: bash
        run: |
          set -euo pipefail
          # A cppcheck that the image already carries would otherwise pass as the pinned
          # one, so the job states which binary answers and compares its version.
          printf 'cppcheck resolves to: %s\n' "$(command -v cppcheck)"
          printf 'cppcheck reports: %s\n' "$(cppcheck --version)"
          built="$(cppcheck --version | awk '{print $2}')"
          if [ "${built}" != "${BOL_CPPCHECK_VERSION}" ]; then
            printf 'the pin is %s and the binary reports %s.\n' \
              "${BOL_CPPCHECK_VERSION}" "${built}"
            exit 1
          fi
          # The addon reaches cppcheck by path, so the layout that cmake --install chose
          # cannot change which script runs.
          test -f cppcheck-src/addons/misra.py

      - name: Build to produce the compilation databases
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          idf.py -C components/bolis/examples/bench build
          idf.py -C components/bolis/test_apps/json build

      - name: Run the MISRA addon and trace every finding
        shell: bash
        run: |
          set -euo pipefail
          # The addon runs without the MISRA headline file, which is licensed and which this
          # repository never carries, so a finding names its guideline by number and carries
          # no text (docs/compliance/misra-gcs.md).
          : > findings.txt
          : > cppcheck.log
          # One filter per run. A cppcheck before 2.19 keeps only the last --file-filter, so
          # several filters leave a project with no match and end the run with an error.
          #
          # The pattern carries no slash before the first directory. A cppcheck before 2.19
          # stores a relative path for a file of the project, and a leading */ never matches
          # a path that starts with the directory itself.
          for db in components/bolis/examples/bench/build \
                    components/bolis/test_apps/json/build; do
            cppcheck \
              --project="${db}/compile_commands.json" \
              --addon=cppcheck-src/addons/misra.py \
              --file-filter='*components/bolis/*' \
              --inline-suppr \
              --enable=style \
              --suppress='*:*/build/*' \
              --suppress="*:${IDF_PATH}/*" 2>&1 | tee -a cppcheck.log
          done

          # An empty result and a result with no finding read the same way, so the job states
          # how many files the checker opened. A filter that matches nothing leaves this at
          # zero, and a job that checked nothing proves nothing.
          checked="$(grep -cE 'Checking .*\.(c|h)' cppcheck.log || true)"
          printf 'files that cppcheck opened: %s\n' "${checked}"
          if [ "${checked}" -eq 0 ]; then
            echo "cppcheck opened no file. The filter or the compilation database is wrong."
            exit 1
          fi

          # A generated file under a build directory is not a file that Bolis authors.
          grep -E 'misra-c2012|style:|warning:|error:' cppcheck.log \
            | grep -E '(^|/)components/bolis/' \
            | grep -vE '/build/' | sort -u > findings.txt || true
          printf 'findings to trace: %s\n' "$(wc -l < findings.txt)"
          cat findings.txt

      - name: Fail on a finding that no adopted macro explains
        shell: bash
        run: |
          set -euo pipefail
          # Record D-002 covers a finding that arises only in adopted code, and it requires a
          # reviewer to trace each finding to its origin. This step performs that trace: a
          # finding on a line that expands no adopted macro is a native finding.
          native=0
          while IFS= read -r finding; do
            [ -n "${finding}" ] || continue
            file="${finding%%:*}"
            rest="${finding#*:}"
            line="${rest%%:*}"
            source_line=""
            if [ -f "${file}" ]; then
              source_line="$(sed -n "${line}p" "${file}")"
            fi
            case "${source_line}" in
              *ESP_LOG*|*WIFI_INIT_CONFIG_DEFAULT*)
                echo "traced to an adopted macro, under D-002: ${finding}"
                ;;
              *)
                echo "NATIVE FINDING: ${finding}"
                echo "    ${source_line}"
                native=$((native + 1))
                ;;
            esac
          done < findings.txt
          if [ "${native}" -gt 0 ]; then
            printf '%d finding(s) in a native file that record D-002 does not cover.\n' "${native}"
            exit 1
          fi
          echo "Every finding traces to the expansion of an adopted macro."

  cert:
    name: CERT C
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the clang toolchain
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          python "${IDF_PATH}/tools/idf_tools.py" install esp-clang

      - name: Build with clang to produce the compilation databases
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          # idf.py clang-check writes a database that holds the application file alone, so
          # the check builds the project with clang and calls clang-tidy over that database.
          IDF_TOOLCHAIN=clang idf.py -C components/bolis/examples/bench -B build-bench-clang build
          IDF_TOOLCHAIN=clang idf.py -C components/bolis/test_apps/json -B build-test-clang build

      - name: Run the CERT checks over the native files
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          clang_tidy="$(dirname "$(command -v clang)")/clang-tidy"
          "${clang_tidy}" --version
          : > cert.log

          firmware=(components/bolis/src/bol_console.c
                    components/bolis/src/bol_frame.c
                    components/bolis/src/bol_stats.c
                    components/bolis/src/bol_rxstats.c
                    components/bolis/src/bol_json.c
                    components/bolis/src/bol_radio.c
                    components/bolis/examples/bench/main/main.c)
          tests=(components/bolis/test/test_bol_frame.c
                 components/bolis/test/test_bol_stats.c
                 components/bolis/test/test_bol_rxstats.c
                 components/bolis/test/test_bol_json.c
                 components/bolis/test_apps/json/main/test_app_main.c)

          "${clang_tidy}" --config-file=.clang-tidy -p build-bench-clang \
            --header-filter='components/bolis/(include|priv_include)/.*' \
            "${firmware[@]}" 2>&1 | tee -a cert.log
          "${clang_tidy}" --config-file=.clang-tidy -p build-test-clang \
            --header-filter='components/bolis/(include|priv_include)/.*' \
            "${tests[@]}" 2>&1 | tee -a cert.log

          # A file that the checker never opened reports no finding, which reads the same way
          # as a clean file. The job counts the files it opened and compares that count with
          # the files it named.
          named=$(( ${#firmware[@]} + ${#tests[@]} ))
          opened="$(grep -cE 'Processing file' cert.log || true)"
          printf 'files named: %s, files that clang-tidy opened: %s\n' "${named}" "${opened}"
          if [ "${opened}" -ne "${named}" ]; then
            echo "clang-tidy did not open every file. The compilation database is wrong."
            exit 1
          fi

          if grep -E "components/bolis/(src|include|priv_include|test|test_apps|examples)/.*(warning|error):" cert.log; then
            echo "A native file produced a CERT finding."
            exit 1
          fi
          echo "No CERT finding in a native file."

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Doxygen
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends doxygen
          doxygen --version

      - name: Build the C API documentation
        shell: bash
        run: |
          set -euo pipefail
          # The configuration sets WARN_AS_ERROR, so a warning fails this step.
          doxygen docs/Doxyfile

          # An input path that matches nothing yields a run with no warning, which reads the
          # same way as a documented API. The job therefore looks for a symbol of each
          # public and private header in the output.
          for symbol in bol_start bol_console_start bol_json_get_u32; do
            if ! grep -rq "${symbol}" html_report; then
              printf 'the output documents no %s, so Doxygen read no header.\n' "${symbol}"
              exit 1
            fi
          done
          echo "The output documents every entry point that the check names."

  host:
    name: Host package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The minimum that the Python coding standard and esptool 5 both set.
          python-version: "3.10"

      - name: Install the host package with its dev extra
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e 'host[dev]'

      - name: Install ruff
        shell: bash
        run: |
          set -euo pipefail
          # The dev extra of host/pyproject.toml carries pytest and mypy, and it carries no
          # ruff, because mise supplies ruff for a local run. This job runs without mise, so
          # it installs ruff here. The version matches the pin in mise.toml, so a lint finding
          # and a format result do not depend on where the check runs.
          python -m pip install --disable-pip-version-check "ruff==0.17.3"
          ruff --version

      - name: Lint and format the host package
        shell: bash
        run: |
          set -euo pipefail
          cd host
          ruff check .
          ruff format --check .

      - name: Check the host package types
        shell: bash
        run: |
          set -euo pipefail
          cd host
          mypy --strict src/bolis
