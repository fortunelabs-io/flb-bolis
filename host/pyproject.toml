[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bolis"
version = "0.1.0"
description = "A bench tool for ESP-NOW. Sweeps the link between two nodes and writes one report."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "esptool>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.11",
]

[project.urls]
repository = "https://github.com/fortunelabs-io/flb-bolis"

[project.scripts]
bolis = "bolis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bolis = ["py.typed"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "S", "ANN", "BLE", "PTH", "ERA", "PL", "RUF", "SIM", "RET", "C4", "PT"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# pytest tests state their expectation with a plain assert, which rewrites to a
# readable failure. The coding standard's "never use assert" rule covers a
# runtime check in the package, not a test case.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
